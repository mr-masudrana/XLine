name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # NOTE: this repo does not check in a Gradle wrapper (gradlew /
      # gradle-wrapper.jar). setup-gradle above installs Gradle 8.5 directly
      # so `gradle` works without one. If you generate a wrapper later
      # (`gradle wrapper --gradle-version 8.5`), switch these steps to
      # `./gradlew` and drop the setup-gradle step's version pin.
      - name: Lint
        run: gradle lint --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
